<!DOCTYPE html>
<html>
<head>
  <title>Your Cart | Antigravity Hardware</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="fade-in">

<div style="max-width: 600px; margin: 0 auto;">
  <h1>Review Your Cart</h1>
  <div id="cartItems" class="card"></div>
  <h2 id="total" style="text-align: right; margin-top: 20px;">Total: ₹0</h2>
  
  <div style="display: flex; gap: 15px; margin-top: 30px;">
    <button onclick="placeOrder()" style="flex: 2;">Place Order Now</button>
    <button onclick="window.location.href='products.html'" style="flex: 1; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main);">Continue Shopping</button>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
