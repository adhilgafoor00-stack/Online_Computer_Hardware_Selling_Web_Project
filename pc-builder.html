<!DOCTYPE html>
<html>
<head>
  <title>Build Your PC | Antigravity Hardware</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="fade-in">

<div style="max-width: 800px; margin: 0 auto;">
  <h1>PC Custom Builder</h1>
  
  <div class="card">
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 30px;">Select your components to see compatibility and total price.</p>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div>
        <label>CPU</label>
        <select id="cpu" onchange="updateBuild()"><option value="">Select CPU</option></select>
      </div>
      <div>
        <label>RAM</label>
        <select id="ram" onchange="updateBuild()"><option value="">Select RAM</option></select>
      </div>
      <div>
        <label>GPU</label>
        <select id="gpu" onchange="updateBuild()"><option value="">Select GPU</option></select>
      </div>
      <div>
        <label>Storage</label>
        <select id="storage" onchange="updateBuild()"><option value="">Select Storage</option></select>
      </div>
    </div>

    <div class="card" style="background: rgba(0,0,0,0.2); margin-top: 30px; text-align: center;">
      <h2 id="buildStatus" style="color: var(--secondary); margin-bottom: 10px;">Select components</h2>
      <h1 id="buildPrice" style="margin: 0;">Total: ₹0</h1>
    </div>

    <button onclick="window.location.href='products.html'" style="margin-top: 20px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main);">Back to Components</button>
  </div>
</div>

<script src="js/script.js"></script>
<script>
  (async () => {
    await fetchProducts();
    loadBuilder();
  })();
</script>
</body>
</html>
