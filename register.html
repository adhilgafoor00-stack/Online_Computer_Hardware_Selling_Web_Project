<!DOCTYPE html>
<html>
<head>
  <title> Registration | Antigravity Hardware</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="center">

<div class="card login-card">
  <h1>New USER</h1>
  <p style="text-align: center; color: var(--text-muted); margin-top: -30px; margin-bottom: 30px;">Authorized Access Only</p>
  <input id="newUser" placeholder="Staff Username">
  <input id="newPass" type="password" placeholder="Temporary Password">
  <button onclick="registerUser()">Create Staff Account</button>
  <div style="margin-top: 20px; text-align: center;">
    <a href="index.html" class="cartLink">Loging Page</a>
  </div>
</div>

<script src="js/script.js"></script>
<script>
  // redirect if not admin
  if (localStorage.getItem('role') !== 'admin') {
    alert('Admin only!');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
