<!DOCTYPE html>
<html>
<head>
  <title>Sign Up | Antigravity Hardware</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="center">

<div class="card login-card">
  <h1>Join Us</h1>
  <p style="text-align: center; color: var(--text-muted); margin-top: -30px; margin-bottom: 30px;">Start your hardware journey today</p>
  <input id="signupUser" placeholder="Create Username">
  <input id="signupPass" type="password" placeholder="Create Password">
  <button onclick="signupUser()">Create Account</button>
  <div style="margin-top: 20px; text-align: center;">
    <p style="font-size: 0.9rem; color: var(--text-muted);">Already have an account?</p>
    <a href="index.html" class="cartLink">Sign In Instead</a>
  </div>
</div>

<script src="js/script.js"></script>
<script>
  // if already logged in redirect
  const role = localStorage.getItem('role');
  if (role) {
    if (role === 'admin') window.location.href = 'admin.html';
    else window.location.href = 'products.html';
  }
</script>

<a href="index.html" class="serviceBtn">Back to login</a>
</body>
</html>
